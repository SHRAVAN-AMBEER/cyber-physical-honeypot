<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DataCore NOC — Secure Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#070b14;--bg2:#0d1221;--border:rgba(0,200,255,0.12);--border2:rgba(0,200,255,0.25);--cyan:#00c8ff;--green:#00ff87;--red:#ff4757;--text:#c9e0ef;--muted:#4a6a80;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;}

/* ── Navbar ── */
.navbar{display:flex;align-items:center;justify-content:space-between;padding:12px 28px;background:rgba(13,18,33,0.95);border-bottom:1px solid var(--border);backdrop-filter:blur(20px);position:sticky;top:0;z-index:100;}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-icon{width:34px;height:34px;background:linear-gradient(135deg,#0066ff,var(--cyan));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.nav-name{font-size:15px;font-weight:700;color:#fff;}
.nav-links{display:flex;gap:4px;}
.nav-link{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);transition:all .2s;letter-spacing:.5px;}
.nav-link:hover{background:rgba(0,200,255,0.08);color:var(--cyan);}
.nav-link.active{background:rgba(0,200,255,0.1);color:var(--cyan);border:1px solid rgba(0,200,255,0.2);}
.nav-status{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;background:rgba(0,255,135,0.1);color:#00ff87;border:1px solid rgba(0,255,135,0.25);}
.dot-live{width:6px;height:6px;border-radius:50%;background:#00ff87;box-shadow:0 0 6px #00ff87;animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ── Login page ── */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.card{background:rgba(13,18,33,0.8);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:100%;max-width:440px;backdrop-filter:blur(20px);}
.logo{text-align:center;margin-bottom:24px;}
.logo-icon{width:54px;height:54px;background:linear-gradient(135deg,#0066ff,var(--cyan));border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 20px rgba(0,200,255,0.4);margin-bottom:12px;}
h1{color:#e0f4ff;font-size:19px;font-weight:700;}
.subtitle{color:var(--muted);font-size:13px;margin-top:4px;}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(0,200,255,0.3),transparent);margin:22px 0;}
.sys-status{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.badge{font-size:11px;padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:5px;font-weight:600;}
.badge-green{background:rgba(0,255,135,0.1);color:#00ff87;border:1px solid rgba(0,255,135,0.3);}
.badge-yellow{background:rgba(255,165,2,0.1);color:#ffa502;border:1px solid rgba(255,165,2,0.3);}
.warn-box{background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,0.2);border-radius:8px;padding:10px 14px;color:#ff6060;font-size:12px;margin-bottom:18px;display:flex;align-items:center;gap:8px;}
label{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px;}
input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,200,255,0.2);border-radius:8px;color:#e0f4ff;font-size:14px;outline:none;transition:all .2s;margin-bottom:16px;font-family:'JetBrains Mono',monospace;}
input:focus{border-color:rgba(0,200,255,0.6);box-shadow:0 0 0 3px rgba(0,200,255,0.1);}
input::placeholder{color:var(--muted);}
button{width:100%;padding:13px;background:linear-gradient(135deg,#0066ff,var(--cyan));border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:all .2s;box-shadow:0 4px 20px rgba(0,150,255,0.3);}
button:hover{transform:translateY(-1px);box-shadow:0 6px 25px rgba(0,150,255,0.5);}
.footer-note{text-align:center;margin-top:18px;color:var(--muted);font-size:11px;}
</style>
</head>
<body>
<div class="grid-bg"></div>

<nav class="navbar">
  <a class="nav-brand" href="/"><div class="nav-icon">🏢</div><span class="nav-name">DataCore NOC</span></a>
  <div class="nav-links">
    <a class="nav-link" href="/">Dashboard</a>
    <a class="nav-link active" href="/login">Secure Login</a>
    <a class="nav-link" href="/emergency">System Status</a>
  </div>
  <div class="nav-status"><span class="dot-live"></span>SYSTEMS ONLINE</div>
</nav>

<div class="login-wrap">
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🔐</div>
      <h1>DataCore Systems</h1>
      <p class="subtitle">Enterprise Infrastructure Management</p>
    </div>
    <div class="divider"></div>
    <div class="sys-status">
      <span class="badge badge-green"><span style="width:6px;height:6px;border-radius:50%;background:#00ff87;box-shadow:0 0 6px #00ff87;animation:blink 1.4s infinite;display:inline-block"></span>SYSTEMS ONLINE</span>
      <span class="badge badge-yellow">RESTRICTED ACCESS</span>
    </div>
    <div class="warn-box">⚠️ Unauthorized access attempts are logged and prosecuted.</div>
    <form method="POST" action="/login">
      <label for="username">Administrator ID</label>
      <input type="text" id="username" name="username" placeholder="admin@datacore.internal" required autocomplete="off">
      <label for="password">Access Passphrase</label>
      <input type="password" id="password" name="password" placeholder="••••••••••••" required autocomplete="off">
      <button type="submit" id="login-btn">🔐 Authenticate & Enter</button>
    </form>
    <div class="footer-note">DataCore v4.2.1 · TLS 1.3 · ISO 27001 Certified</div>
  </div>
</div>
</body>
</html>
